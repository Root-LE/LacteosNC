<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Lácteos NC</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/styles.css?v=3">
<style>
  .error404 {
    min-height: 100svh; display: grid; place-items: center; text-align: center;
    padding: 3rem 1.25rem; position: relative; overflow: hidden;
  }
  .error404__caja { position: relative; z-index: 2; max-width: 32rem; }
  .error404 img { width: 140px; height: 140px; margin: 0 auto 1.5rem; }
  .error404 h1 { font-size: clamp(2.6rem, 8vw, 4.5rem); text-transform: uppercase; color: var(--rojo); margin-bottom: .3em; }
  .error404 p { color: var(--gris); font-size: 1.15rem; margin-bottom: 2rem; }
  .error404 .hero__franja { height: 7rem; }
</style>
</head>
<body>
<main class="error404">
  <div class="error404__caja">
    <img src="/img/logo-nc.png" alt="Lácteos NC Jacinto Arauz" width="140" height="140">
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Volvé al inicio para ver nuestros quesos, cremas y dulce de leche.</p>
    <a class="btn btn--rojo" href="/">Ir al inicio</a>
  </div>
  <div class="hero__franja" aria-hidden="true"></div>
</main>
</body>
</html>
